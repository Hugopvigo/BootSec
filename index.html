<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MugreCorp MODEL 69 — Amber Terminal</title>
<style>
  :root{
    --amber:#ffb000;
    --amber-pale:#ffd67a;
    --green:#7dff9b;
    --red:#ff6b5e;
    --brown:#7a5410;
    --bg:#0a0700;
    --glow:0 0 2px rgba(255,176,0,.65), 0 0 10px rgba(255,176,0,.22);
  }

  *{box-sizing:border-box}

  html,body{margin:0;min-height:100%}

  body{
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, #1c1305 0%, #0d0902 55%, #060401 100%);
    color:var(--amber);
    font-family:"Courier New", Courier, monospace;
    font-size:16px;
    line-height:1.45;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(18px,4vw,52px) clamp(10px,3vw,32px) 44px;
    min-height:100vh;
  }

  /* dim-room vignette */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%);
    z-index:0;
  }
  .machine,.quickbar,.hint{position:relative;z-index:1}

  /* ---------- outer shell ---------- */
  .machine{
    width:100%;
    max-width:980px;
    background:linear-gradient(160deg,#2c1f0d 0%,#1a1106 46%,#120b04 100%);
    border:2px solid #3a2912;
    border-radius:clamp(18px,3vw,32px);
    padding:clamp(12px,2.6vw,28px);
    box-shadow:
      0 30px 60px rgba(0,0,0,.75),
      0 8px 20px rgba(0,0,0,.6),
      inset 0 2px 1px rgba(255,214,122,.14),
      inset 0 -3px 7px rgba(0,0,0,.75);
  }

  /* ---------- top bezel strip ---------- */
  .bezel-top{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px 16px;
    padding:2px clamp(6px,1.5vw,14px) 13px;
  }
  .brand{
    color:var(--amber-pale);
    font-size:clamp(15px,2.4vw,22px);
    font-weight:bold;
    letter-spacing:.06em;
    text-shadow:var(--glow);
    white-space:nowrap;
  }
  .brand .model{color:var(--amber)}
  .bezel-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px}

  .bios-badge{
    border:1px solid var(--brown);
    background:#0e0a03;
    color:var(--amber-pale);
    padding:3px 8px;
    font-size:.74em;
    letter-spacing:.12em;
    box-shadow:inset 0 0 8px rgba(255,176,0,.08);
    white-space:nowrap;
  }

  .leds{display:flex;gap:12px}
  .led{display:flex;align-items:center;gap:6px;color:var(--brown);font-size:.7em;letter-spacing:.08em}
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--brown);
    box-shadow:inset 0 0 3px rgba(0,0,0,.9);
  }
  .dot.on-green{background:var(--green);box-shadow:0 0 9px var(--green),inset 0 0 2px rgba(255,255,255,.7)}
  .dot.on-amber{background:var(--amber);box-shadow:0 0 9px var(--amber),inset 0 0 2px rgba(255,255,255,.6)}
  .dot.activity.active{background:var(--amber);box-shadow:0 0 12px var(--amber),0 0 4px var(--amber)}

  /* ---------- screen frame ---------- */
  .screen-frame{
    background:#120c05;
    border:1px solid #2c1f0d;
    border-radius:clamp(14px,2vw,22px);
    padding:clamp(9px,1.8vw,20px);
    box-shadow:inset 0 3px 12px rgba(0,0,0,.95),inset 0 -1px 0 rgba(255,176,0,.08);
  }

  .crt{
    position:relative;
    overflow:hidden;
    height:clamp(300px,44vw,470px);
    border-radius:clamp(8px,1.4vw,16px);
    background:var(--bg);
    box-shadow:inset 0 0 70px rgba(0,0,0,.95),inset 0 0 24px rgba(255,176,0,.06);
  }

  .layer{position:absolute;inset:0;pointer-events:none;z-index:3}
  .bloom{
    background:radial-gradient(ellipse at 50% 48%, rgba(255,176,0,.12) 0%, rgba(255,176,0,.035) 55%, transparent 78%);
    animation:flicker 7s infinite ease-in-out;
  }
  .scanlines{
    background:repeating-linear-gradient(to bottom,
      transparent 0, transparent 2px,
      rgba(0,0,0,.34) 2px, rgba(0,0,0,.34) 4px);
    mix-blend-mode:multiply;
  }
  .vignette{
    background:radial-gradient(ellipse at 50% 45%, transparent 48%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.92) 100%);
  }
  .sheen{background:linear-gradient(125deg,rgba(255,255,255,.035),transparent 38%)}

  @keyframes flicker{0%,100%{opacity:1}47%{opacity:.97}49%{opacity:.9}51%{opacity:1}}

  /* ---------- terminal ---------- */
  .terminal{
    position:absolute;
    inset:0;
    z-index:2;
    padding:clamp(12px,2vw,24px);
    overflow-y:auto;
    overflow-x:hidden;
    font-size:clamp(13px,1.6vw,16px);
    color:var(--amber);
    text-shadow:var(--glow);
    scrollbar-width:thin;
    scrollbar-color:var(--brown) var(--bg);
  }
  .terminal::-webkit-scrollbar{width:8px}
  .terminal::-webkit-scrollbar-track{background:var(--bg)}
  .terminal::-webkit-scrollbar-thumb{background:var(--brown);border-radius:4px}

  .line{white-space:pre-wrap;word-break:break-word;min-height:1.45em}
  .head{color:var(--amber-pale);font-weight:bold}
  .ok{color:var(--green)}
  .none,.dim{color:var(--brown)}
  .err{color:var(--red)}
  .prompt{color:var(--amber-pale);font-weight:bold}

  .cursor{
    display:inline-block;
    width:.62em;height:1.05em;
    background:var(--amber);
    vertical-align:-.18em;
    box-shadow:0 0 8px rgba(255,176,0,.75);
    animation:blink 1.05s steps(1,end) infinite;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  .capture{position:fixed;top:-200px;left:-200px;opacity:0;width:1px;height:1px;border:0}

  /* ---------- bottom bezel strip ---------- */
  .bezel-bottom{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:6px 18px;
    padding:13px clamp(6px,1.5vw,14px) 2px;
    color:var(--brown);
    font-size:clamp(10px,1.2vw,13px);
    letter-spacing:.04em;
  }
  .bezel-bottom .hw{color:var(--amber)}

  /* ---------- quick commands ---------- */
  .quickbar{
    width:100%;
    max-width:980px;
    margin-top:clamp(14px,2.4vw,24px);
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .qbtn{
    font-family:inherit;
    font-size:clamp(11px,1.3vw,14px);
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--amber-pale);
    background:linear-gradient(180deg,#2a1c0b,#160e05);
    border:1px solid #4a3315;
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,214,122,.16),0 3px 0 #0b0703,0 5px 8px rgba(0,0,0,.5);
    transition:transform .06s,box-shadow .06s,color .15s;
  }
  .qbtn:hover{color:var(--amber);box-shadow:inset 0 1px 0 rgba(255,214,122,.2),0 3px 0 #0b0703,0 5px 16px rgba(255,176,0,.28)}
  .qbtn:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(0,0,0,.8),0 0 0 #0b0703}
  .qbtn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .qbtn:disabled{opacity:.32;cursor:not-allowed}

  .hint{margin-top:14px;color:var(--brown);font-size:12px;letter-spacing:.04em;text-align:center}

  ::selection{background:var(--amber);color:var(--bg)}

  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none}
    .bloom{animation:none}
    .qbtn{transition:none}
  }
</style>
</head>
<body>

  <main class="machine" id="machine">
    <div class="bezel-top">
      <div class="brand">MUGRECORP <span class="model">MODEL 69</span></div>
      <div class="bezel-right">
        <span class="bios-badge">BIOS 1.4</span>
        <div class="leds" aria-label="System indicators">
          <span class="led"><span class="dot on-green"></span>PWR</span>
          <span class="led"><span class="dot on-amber"></span>BIOS</span>
          <span class="led"><span class="dot activity" id="activityLed"></span>ACT</span>
        </div>
      </div>
    </div>

    <div class="screen-frame">
      <div class="crt" id="crt">
        <div class="layer bloom"></div>
        <div class="layer scanlines"></div>
        <div class="layer vignette"></div>
        <div class="layer sheen"></div>

        <div class="terminal" id="terminal" aria-label="Terminal output">
          <div id="output"></div>
          <div class="line" id="promptline"><span class="prompt">C:\HUGO&gt;</span><span id="buffer"></span><span class="cursor" id="cursor"></span></div>
        </div>
      </div>
    </div>

    <div class="bezel-bottom">
      <span class="hw">6502 · 64K RAM · 5.25" FDD · K-7 TAPE</span>
      <span class="hw">HUGO PEREZ-VIGO</span>
      <span>(C) 1979 MUGRECORP — ALL RIGHTS RESERVED</span>
    </div>
  </main>

  <nav class="quickbar" id="quickbar" aria-label="Quick commands">
    <button class="qbtn" data-cmd="help">help</button>
    <button class="qbtn" data-cmd="dir">dir</button>
    <button class="qbtn" data-cmd="ver">ver</button>
    <button class="qbtn" data-cmd="mem">mem</button>
    <button class="qbtn" data-cmd="spec">spec</button>
    <button class="qbtn" data-cmd="time">time</button>
    <button class="qbtn" data-cmd="about">about</button>
    <button class="qbtn" data-cmd="cls">cls</button>
    <button class="qbtn" data-cmd="reboot">reboot</button>
  </nav>

  <p class="hint">TYPE HELP AND PRESS ENTER · CLICK THE SCREEN TO FOCUS THE KEYBOARD</p>

  <input class="capture" id="capture" type="text" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" aria-label="Command input">

<script>
(function(){
  "use strict";

  var output   = document.getElementById("output");
  var terminal = document.getElementById("terminal");
  var crt      = document.getElementById("crt");
  var bufferEl = document.getElementById("buffer");
  var capture  = document.getElementById("capture");
  var actLed   = document.getElementById("activityLed");
  var buttons  = Array.prototype.slice.call(document.querySelectorAll(".qbtn"));

  var booted     = false;
  var buffer     = "";
  var history    = [];
  var historyIdx = -1;
  var actTimer   = null;
  var PROMPT     = "C:\\HUGO>";

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function scrollBottom(){ terminal.scrollTop = terminal.scrollHeight; }

  function pulseActivity(){
    actLed.classList.add("active");
    clearTimeout(actTimer);
    actTimer = setTimeout(function(){ actLed.classList.remove("active"); }, 170);
  }

  /* ---------- output helpers ---------- */
  function addLine(text, cls){
    var d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    d.textContent = text;
    output.appendChild(d);
    scrollBottom();
    return d;
  }

  function addLines(rows){
    rows.forEach(function(row){ addLine(row[0], row[1]); });
  }

  function echoCommand(cmd){
    var d = document.createElement("div");
    d.className = "line";
    var p = document.createElement("span");
    p.className = "prompt";
    p.textContent = PROMPT;
    var t = document.createElement("span");
    t.textContent = cmd;
    d.appendChild(p);
    d.appendChild(t);
    output.appendChild(d);
    scrollBottom();
  }

  /* ---------- typing effect ---------- */
  function typeSegments(lineEl, segments, charDelay){
    return (async function(){
      for (var i = 0; i < segments.length; i++){
        var seg = segments[i];
        var span = document.createElement("span");
        span.className = seg.c || "";
        lineEl.appendChild(span);
        for (var j = 0; j < seg.t.length; j++){
          span.textContent += seg.t.charAt(j);
          scrollBottom();
          await sleep(charDelay);
        }
      }
    })();
  }

  function leader(label, width){
    width = width || 40;
    if (label.length >= width) return label + " ";
    return label + " " + Array(width - label.length).join(".") + " ";
  }

  /* ---------- POST ---------- */
  var postItems = [
    { label:"CPU      MOS 6502 @ 1.00 MHZ",          status:"OK",   cls:"ok"   },
    { label:"RAM      64 KB DYNAMIC RAM",            status:"OK",   cls:"ok"   },
    { label:"ROM      16 KB MONITOR / BASIC",        status:"OK",   cls:"ok"   },
    { label:"CRT      40 X 25 AMBER PHOSPHOR",       status:"OK",   cls:"ok"   },
    { label:"FLOPPY A 5.25\" SINGLE DENSITY",        status:"OK",   cls:"ok"   },
    { label:"FLOPPY B NOT INSTALLED",                status:"NONE", cls:"none" },
    { label:"TAPE     K-7 CASSETTE, 1200 BAUD",      status:"OK",   cls:"ok"   },
    { label:"RTC      512 HZ TICK",                  status:"OK",   cls:"ok"   }
  ];

  var postLines = [
    [{ t:"MUGRECORP MODEL 69", c:"head" }],
    [{ t:"SYSTEM BIOS REV 1.4   (C) 1979 MUGRECORP", c:"dim" }],
    [{ t:"" }]
  ];
  postItems.forEach(function(it){
    postLines.push([
      { t:leader(it.label, 40), c:"" },
      { t:it.status, c:it.cls }
    ]);
  });
  postLines.push([{ t:"" }]);
  postLines.push([{ t:"POST COMPLETE — 4.21 SECONDS ELAPSED", c:"head" }]);

  async function runPost(){
    booted = false;
    setButtons(false);
    buffer = "";
    capture.value = "";
    renderBuffer();
    output.innerHTML = "";
    crt.style.filter = "brightness(1.35)";
    setTimeout(function(){ crt.style.filter = "brightness(1)"; }, 220);

    for (var i = 0; i < postLines.length; i++){
      var line = document.createElement("div");
      line.className = "line";
      output.appendChild(line);
      await typeSegments(line, postLines[i], 9);
      await sleep(90 + Math.random() * 170);
    }

    addLine("", "");
    booted = true;
    setButtons(true);
    pulseActivity();
    scrollBottom();
    focusInput();
  }

  /* ---------- commands ---------- */
  function currentTime(){
    var d = new Date();
    var pad = function(n){ return (n < 10 ? "0" : "") + n; };
    var days  = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
    var months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    return [
      ["CURRENT TIME: " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds())],
      ["DATE: " + days[d.getDay()] + ", " + pad(d.getDate()) + " " + months[d.getMonth()] + " " + d.getFullYear()]
    ];
  }

  function runCommand(name){
    switch (name){
      case "help":
        addLines([
          ["AVAILABLE COMMANDS:", "head"],
          ["  HELP    SHOW THIS LIST"],
          ["  DIR     LIST DIRECTORY"],
          ["  VER     SHOW SYSTEM VERSION"],
          ["  MEM     SHOW MEMORY USAGE"],
          ["  SPEC    SHOW HARDWARE SPECIFICATIONS"],
          ["  TIME    SHOW CURRENT TIME"],
          ["  ABOUT   ABOUT THIS MACHINE"],
          ["  CLS     CLEAR THE SCREEN"],
          ["  REBOOT  RESTART AND RUN POST"]
        ]);
        break;

      case "dir":
        addLines([
          ["VOLUME IN DRIVE A: MUGRE69", "head"],
          ["DIRECTORY OF A:\\", "dim"],
          [""],
          ["  SYSTEM  BAT      512   01-01-79  12:00a"],
          ["  AUTO    EXE   12,288   01-01-79  12:01a"],
          ["  HELLO   TXT      256   01-01-79  12:02a"],
          ["  GAMES   DIR             01-01-79  12:03a"],
          ["  README  TXT    1,024   01-01-79  12:04a"],
          [""],
          ["     5 FILE(S)        14,080 BYTES"],
          ["   327,680 BYTES FREE", "ok"]
        ]);
        break;

      case "ver":
        addLines([
          ["MUGRECORP PERSONAL DOS  VERSION 1.40", "head"],
          ["(C) COPYRIGHT MUGRECORP 1979. ALL RIGHTS RESERVED.", "dim"],
          ["BIOS REVISION 1.4 — 6502 MONITOR"]
        ]);
        break;

      case "mem":
        addLines([
          ["MEMORY MAP:", "head"],
          ["  00000 - 03FFF   16 KB  ROM MONITOR"],
          ["  04000 - 0FFFF   64 KB  USER RAM"],
          ["  10000 - 13FFF   16 KB  VIDEO RAM"],
          ["  ------------------------------", "dim"],
          ["  TOTAL RAM ........ 65,536 BYTES", "ok"],
          ["  FREE ............. 61,440 BYTES", "ok"],
          ["  USED .............. 4,096 BYTES"]
        ]);
        break;

      case "spec":
        addLines([
          ["MUGRECORP MODEL 69 — SYSTEM SPECIFICATION", "head"],
          [leader("  CPU", 16) + "MOS 6502 @ 1.00 MHZ"],
          [leader("  RAM", 16) + "64 KB DYNAMIC"],
          [leader("  ROM", 16) + "16 KB MONITOR / BASIC"],
          [leader("  DISPLAY", 16) + "40 X 25 AMBER PHOSPHOR CRT"],
          [leader("  FLOPPY A", 16) + "5.25\" SINGLE DENSITY, 90 KB"],
          [leader("  FLOPPY B", 16) + "NONE INSTALLED", "none"],
          [leader("  TAPE", 16) + "K-7 CASSETTE AT 1200 BAUD"],
          [leader("  RTC", 16) + "512 HZ TICK"],
          [leader("  SERIAL", 16) + "RS-232C, 300 BAUD"]
        ]);
        break;

      case "time":
        addLines(currentTime());
        break;

      case "about":
        addLines([
          ["MUGRECORP MODEL 69", "head"],
          ["A PERSONAL COMPUTER FOR THE REST OF US.", "dim"],
          [""],
          ["BUILT IN A DIM ROOM, SOMEWHERE, IN 1979."],
          ["64K OF RAM, AN AMBER SCREEN AND NO PRETENSIONS."],
          [""],
          ["ON THE WEB: https://hugopvigo.github.io/BootSec/", "ok"],
          ["TYPE HELP FOR A LIST OF COMMANDS.", "ok"]
        ]);
        break;

      case "cls":
        output.innerHTML = "";
        break;

      case "reboot":
        output.innerHTML = "";
        buffer = "";
        capture.value = "";
        renderBuffer();
        pulseActivity();
        runPost();
        break;

      default:
        addLine("BAD COMMAND OR FILE NAME: " + name, "err");
        addLine("TYPE HELP FOR A LIST OF COMMANDS.", "dim");
    }
    scrollBottom();
  }

  /* ---------- input / prompt ---------- */
  function renderBuffer(){ bufferEl.textContent = buffer; }

  function focusInput(){
    if (booted){ try{ capture.focus({ preventScroll:true }); }catch(e){ capture.focus(); } }
  }

  function execute(name){
    echoCommand(name);
    history.push(name);
    historyIdx = -1;
    pulseActivity();
    runCommand(name);
    scrollBottom();
  }

  function submit(){
    if (!booted) return;
    var cmd = buffer;
    buffer = "";
    capture.value = "";
    renderBuffer();
    var trimmed = cmd.trim();
    if (trimmed){
      echoCommand(trimmed.replace(/\s+/g, " "));
      history.push(trimmed.replace(/\s+/g, " "));
      historyIdx = -1;
      pulseActivity();
      runCommand(trimmed.split(/\s+/)[0].toLowerCase());
    }
    scrollBottom();
  }

  function histUp(){
    if (!history.length) return;
    if (historyIdx === -1) historyIdx = history.length - 1;
    else if (historyIdx > 0) historyIdx--;
    buffer = history[historyIdx];
    capture.value = buffer;
    renderBuffer();
    scrollBottom();
  }

  function histDown(){
    if (historyIdx === -1) return;
    if (historyIdx < history.length - 1){
      historyIdx++;
      buffer = history[historyIdx];
    } else {
      historyIdx = -1;
      buffer = "";
    }
    capture.value = buffer;
    renderBuffer();
    scrollBottom();
  }

  capture.addEventListener("input", function(){
    if (!booted){ capture.value = ""; return; }
    buffer = capture.value;
    renderBuffer();
    pulseActivity();
    scrollBottom();
  });

  capture.addEventListener("keydown", function(e){
    if (e.key === "Enter"){
      e.preventDefault();
      submit();
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      histUp();
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      histDown();
    } else if (e.ctrlKey && (e.key === "l" || e.key === "L")){
      e.preventDefault();
      runCommand("cls");
    } else if (e.ctrlKey && (e.key === "c" || e.key === "C")){
      e.preventDefault();
      buffer = "";
      capture.value = "";
      renderBuffer();
    }
  });

  crt.addEventListener("click", focusInput);

  buttons.forEach(function(b){
    b.addEventListener("click", function(){
      if (!booted) return;
      execute(b.getAttribute("data-cmd"));
      focusInput();
    });
  });

  function setButtons(on){
    buttons.forEach(function(b){ b.disabled = !on; });
  }

  /* ---------- boot ---------- */
  setButtons(false);
  runPost();
})();
</script>
</body>
</html>
